<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X 地道双语助手</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1419;
      color: #e7e9ea;
      font-size: 13px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #8b98a5;
      font-size: 12px;
      font-weight: 500;
    }
    input[type="text"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #2f3336;
      background: #16181c;
      color: #e7e9ea;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    textarea {
      resize: vertical;
      min-height: 58px;
      font-size: 12px;
      line-height: 1.45;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: #1d9bf0;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid #2f3336;
    }
    .toggle-row label {
      margin: 0;
      color: #e7e9ea;
      font-size: 13px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: #1d9bf0;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1a8cd8;
    }
    .btn-secondary {
      background: #272c30;
      color: #e7e9ea;
    }
    .btn-secondary:hover {
      background: #33393e;
    }
    .status {
      margin-top: 10px;
      min-height: 18px;
      font-size: 12px;
      color: #1d9bf0;
      text-align: center;
    }
    .status.error {
      color: #f4212e;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #71767b;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <h1>🌐 X 地道双语助手</h1>

  <div class="field">
    <label for="provider">模型服务商预设</label>
    <select id="provider">
      <option value="deepseek">DeepSeek (性价比推荐)</option>
      <option value="openai">OpenAI (GPT-4o / 4o-mini)</option>
      <option value="gemini">Google Gemini (OpenAI 兼容端点)</option>
      <option value="groq">Groq</option>
      <option value="custom">自定义 (OpenAI 兼容 / Ollama)</option>
    </select>
  </div>

  <div class="field">
    <label for="apiBaseUrl">API Base URL</label>
    <input type="text" id="apiBaseUrl" placeholder="https://api.deepseek.com/v1" />
  </div>

  <div class="field">
    <label for="apiKey">API Key</label>
    <div style="display:flex;gap:6px;align-items:center;">
      <input type="password" id="apiKey" placeholder="sk-..." style="flex:1;" />
      <button type="button" id="toggleKeyBtn" class="btn-secondary" style="flex:0 0 auto;padding:7px 10px;border-radius:8px;font-size:12px;">显示</button>
    </div>
  </div>

  <div class="field">
    <label for="model">模型名称 (Model)</label>
    <input type="text" id="model" placeholder="deepseek-chat" />
  </div>

  <div class="field">
    <label for="defaultTone">发帖/回复默认美语语气</label>
    <select id="defaultTone">
      <option value="casual">日常美语 (Natural / Casual)</option>
      <option value="witty">幽默玩梗 (Witty / Twitter-native)</option>
      <option value="friendly">友好热情 (Friendly / Warm)</option>
      <option value="professional">专业得体 (Clear / Professional)</option>
    </select>
  </div>

  <div class="field">
    <label for="glossary">自定义术语 / 固定译法（可选，每行一条）</label>
    <textarea id="glossary" placeholder="例：&#10;小说工坊=NovelForge&#10;破防=tilted / hit hard&#10;Agent=Agent（保留英文）"></textarea>
  </div>

  <div class="toggle-row">
    <label for="autoTranslate">滚动时自动翻译英文推文</label>
    <input type="checkbox" id="autoTranslate" />
  </div>

  <div class="toggle-row">
    <label for="showSlangNotes">附带俚语/俗语/梗解析</label>
    <input type="checkbox" id="showSlangNotes" checked />
  </div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="testBtn">测试连接</button>
    <button type="button" class="btn-secondary" id="clearCacheBtn">清空缓存</button>
    <button type="button" class="btn-primary" id="saveBtn">保存设置</button>
  </div>

  <div class="status" id="status"></div>

  <div class="hint">
    提示：在 X 输入框输入中文后，点击「✨ 译为地道美语」或按 <b>Alt + T</b>，即可结合当前回复语境一键转为地道美式英语。
  </div>

  <script src="popup.js"></script>
</body>
</html>
