<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X 地道双语助手</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1419;
      color: #e7e9ea;
      font-size: 13px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field {
      margin-bottom: 12px;
    }
    .field-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .field-row .field {
      flex: 1;
      margin-bottom: 0;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #8b98a5;
      font-size: 12px;
      font-weight: 500;
    }
    input[type="text"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #2f3336;
      background: #16181c;
      color: #e7e9ea;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    textarea {
      resize: vertical;
      min-height: 58px;
      font-size: 12px;
      line-height: 1.45;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: #1d9bf0;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid #2f3336;
    }
    .toggle-row label {
      margin: 0;
      color: #e7e9ea;
      font-size: 13px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: #1d9bf0;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1a8cd8;
    }
    .btn-secondary {
      background: #272c30;
      color: #e7e9ea;
    }
    .btn-secondary:hover {
      background: #33393e;
    }
    .status {
      margin-top: 10px;
      min-height: 18px;
      font-size: 12px;
      color: #1d9bf0;
      text-align: center;
    }
    .status.error {
      color: #f4212e;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #71767b;
      line-height: 1.45;
    }
    details.opt-box {
      margin-bottom: 10px;
      border: 1px solid #2f3336;
      border-radius: 8px;
      padding: 8px 10px;
      background: #13161a;
    }
    details.opt-box summary {
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #e7e9ea;
      user-select: none;
    }
    details.opt-box .opt-body {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🌐 X 地道双语助手</h1>

  <div class="field">
    <label for="targetRegion">面向地区 / 运营模式</label>
    <select id="targetRegion">
      <option value="en">英文区（英译中 + 英文回帖 / 写新闻长文）</option>
      <option value="zh">中文区（关闭翻译 · 纯中文回帖 / 写新闻长文）</option>
    </select>
  </div>

  <div class="field">
    <label for="provider">模型服务商预设</label>
    <select id="provider">
      <option value="deepseek">DeepSeek (文本高性价比)</option>
      <option value="openai">OpenAI (GPT-4o / 4o-mini · 支持识图)</option>
      <option value="gemini">Google Gemini (支持识图)</option>
      <option value="groq">Groq</option>
      <option value="custom">自定义 (OpenAI 兼容 / Ollama)</option>
    </select>
  </div>

  <div class="field">
    <label for="apiBaseUrl">API Base URL</label>
    <input type="text" id="apiBaseUrl" placeholder="https://api.deepseek.com/v1" />
  </div>

  <div class="field">
    <label for="apiKey">API Key</label>
    <div style="display:flex;gap:6px;align-items:center;">
      <input type="password" id="apiKey" placeholder="sk-..." style="flex:1;" />
      <button type="button" id="toggleKeyBtn" class="btn-secondary" style="flex:0 0 auto;padding:7px 10px;border-radius:8px;font-size:12px;">显示</button>
    </div>
  </div>

  <div class="field">
    <label for="model">模型名称 (Model)</label>
    <input type="text" id="model" placeholder="deepseek-chat" />
  </div>

  <div class="field-row">
    <div class="field">
      <label for="defaultTone">默认回复立场</label>
      <select id="defaultTone">
        <option value="mix">智能混搭 (引战/另类/接梗)</option>
        <option value="contrarian">挑刺引战 (Contrarian)</option>
        <option value="alternative">另类视角 (Alternative)</option>
        <option value="witty">幽默玩梗 (Witty)</option>
        <option value="insight">深度补充 (Insight)</option>
        <option value="casual">日常友好 (Casual)</option>
      </select>
    </div>
    <div class="field">
      <label for="defaultLength">默认回复篇幅</label>
      <select id="defaultLength">
        <option value="auto">长短适中</option>
        <option value="short">短评 (1-2句)</option>
        <option value="medium">中长评 (2-4句)</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label for="glossary">自定义术语 / 固定译法（可选，每行一条）</label>
    <textarea id="glossary" placeholder="例：&#10;小说工坊=NovelForge&#10;破防=tilted / hit a nerve&#10;Agent=Agent（保留英文）"></textarea>
  </div>

  <details class="opt-box">
    <summary>🔍 可选：新闻搜索增强 API（默认免费源）</summary>
    <div class="opt-body">
      <div class="field">
        <label for="searchProvider">搜索增强服务商</label>
        <select id="searchProvider">
          <option value="none">不使用（仅内置免费媒体 / 官博 / HN / Reddit）</option>
          <option value="grok">xAI Grok（实时搜 X + Web）</option>
          <option value="tavily">Tavily AI News Search</option>
          <option value="perplexity">Perplexity Sonar（实时联网新闻）</option>
          <option value="exa">Exa Neural Search</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field" style="flex:1.4;">
          <label for="searchApiKey">搜索 API Key</label>
          <input type="password" id="searchApiKey" placeholder="留空仅走免费源" />
        </div>
        <div class="field" style="flex:1;">
          <label for="searchModel">模型（可选）</label>
          <input type="text" id="searchModel" placeholder="grok-3-mini / sonar" />
        </div>
      </div>
    </div>
  </details>

  <details class="opt-box">
    <summary>🎨 🎬 可选：AI 生图 / 生视频协作</summary>
    <div class="opt-body">
      <div class="toggle-row" style="border-top:none;padding-top:0;">
        <label for="imageGenEnabled">启用 AI 生图协作（成稿可一键配图）</label>
        <input type="checkbox" id="imageGenEnabled" />
      </div>
      <div class="field">
        <label for="imageGenProvider">生图服务商预设</label>
        <select id="imageGenProvider">
          <option value="openai">OpenAI (gpt-image-1 / dall-e-3)</option>
          <option value="grok">xAI Grok Imagine (grok-2-image)</option>
          <option value="siliconflow">SiliconFlow (FLUX.1-schnell)</option>
          <option value="custom">自定义 OpenAI 兼容生图端点</option>
        </select>
      </div>
      <div class="field">
        <label for="imageGenBaseUrl">生图 API URL</label>
        <input type="text" id="imageGenBaseUrl" placeholder="https://api.openai.com/v1/images/generations" />
      </div>
      <div class="field-row">
        <div class="field" style="flex:1.3;">
          <label for="imageGenApiKey">生图 API Key</label>
          <input type="password" id="imageGenApiKey" placeholder="sk-..." />
        </div>
        <div class="field" style="flex:1;">
          <label for="imageGenModel">生图模型</label>
          <input type="text" id="imageGenModel" placeholder="gpt-image-1" />
        </div>
      </div>

      <div class="toggle-row">
        <label for="videoGenEnabled">启用 AI 生视频协作（图文联动）</label>
        <input type="checkbox" id="videoGenEnabled" />
      </div>
      <div class="field">
        <label for="videoGenBaseUrl">生视频 API URL（支持同步或任务轮询端点）</label>
        <input type="text" id="videoGenBaseUrl" placeholder="https://.../v1/videos/generations" />
      </div>
      <div class="field-row">
        <div class="field" style="flex:1.3;">
          <label for="videoGenApiKey">生视频 API Key</label>
          <input type="password" id="videoGenApiKey" placeholder="API Key" />
        </div>
        <div class="field" style="flex:1;">
          <label for="videoGenModel">生视频模型</label>
          <input type="text" id="videoGenModel" placeholder="如 kling / veo / runway" />
        </div>
      </div>
    </div>
  </details>

  <div class="toggle-row" id="autoTranslateRow">
    <label for="autoTranslate">滚动时自动翻译英文推文</label>
    <input type="checkbox" id="autoTranslate" />
  </div>

  <div class="toggle-row" id="showSlangNotesRow">
    <label for="showSlangNotes">附带俚语/俗语/梗解析</label>
    <input type="checkbox" id="showSlangNotes" checked />
  </div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="testBtn">测试连接</button>
    <button type="button" class="btn-secondary" id="clearCacheBtn">清空缓存</button>
    <button type="button" class="btn-primary" id="saveBtn">保存设置</button>
  </div>

  <div class="status" id="status"></div>

  <div class="hint">
    提示：支持自动识图（模型不支持时自动降级为文本+Alt）。在输入框按 <b>Alt + T</b> 可一键直译，选用候选后下次可勾选「🔗 延续上条」连贯续写。
  </div>

  <script src="popup.js"></script>
</body>
</html>
